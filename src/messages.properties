# Placeholders use MessageFormat: {0}, {1}, ... and {0,number,0.00} for money.
# 'number' is a keyword used by MessageFormat to specify that the value is a number
# A literal apostrophe must be doubled ('').
# Leading spaces in a value are trimmed, so indentation is added in GameUI.

# ---------- input validation ----------
input.notNumber=Please enter a number.
input.invalidChoice=Invalid choice. Please try again.
input.invalidTable=Invalid table number. Please try again.
input.invalidOrder=Invalid order number. Please try again.

# ---------- waiter menu and prompts ----------
waiter.menu.title=Choose an action for the waiter:
waiter.menu.seat=1. Seat a customer
waiter.menu.takeOrder=2. Take an order
waiter.menu.serve=3. Serve an order
waiter.menu.wait=4. Wait
waiter.prompt.table=Enter the table number to take order from (1-{0}):
waiter.prompt.serve=Enter order number to serve:

# ---------- chef menu and prompts ----------
chef.menu.title=Choose an action for the chef:
chef.menu.prepare=1. Prepare an order
chef.menu.wait=2. Wait
chef.prompt.prepare=Enter the number of the order to prepare:

